[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "navira"
version = "0.1.0"
description = "Motor de evacuación dinámica para el reto Escape de Manta Zombie."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = ["httpx2>=2.0,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/navira"]
