services:
  - type: web
    name: navira-api-walthergl66
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: python -m pip install .
    startCommand: uvicorn navira.main:app --app-dir src --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /salud
    envVars:
      - key: NAVIRA_API_KEY
        generateValue: true
      - key: NAVIRA_COOKIE_SECURE
        value: "1"
      - key: NAVIRA_PUBLIC_DEMO_CONTROL
        value: "1"
      - key: NAVIRA_PUBLIC_MAX_SESSIONS
        value: "1"
      - key: NAVIRA_PUBLIC_SESSION_IDLE_SECONDS
        value: "900"
      - key: NAVIRA_ALLOWED_ORIGINS
        sync: false
